name: CI

on:
  # Only main on push. Every other branch is covered by its pull_request run,
  # and listing "**" here ran the whole suite twice on every PR commit.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep this job name exactly as-is: "lint + test" is the required status
    # check configured on main. Renaming it silently stops main from ever seeing
    # a passing check. The job does more than its name says; that is the lesser
    # of the two problems.
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This job only reads the repo — it posts no comments, pushes no commits and
    # publishes no packages. Say so explicitly so the token cannot be used for
    # more than a checkout if a dependency in the install step turns hostile.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Node 20 to match the production image (Dockerfile: node:20-slim).
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      # `tsc --noEmit` is not the same gate as `next build` — it misses
      # prerender failures, route config errors and bundling problems. The
      # Dockerfile runs this exact command, so without it here the first thing
      # that discovers a broken build is the production deploy. Verified to
      # pass with no environment variables set.
      - name: Build
        run: npm run build
