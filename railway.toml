# Railway build + deploy config for Carousel Maker.
#
# Builds the existing production Dockerfile (Next.js standalone) and runs it as a
# single persistent service. Railway injects PORT at runtime; the standalone
# server binds it automatically (HOSTNAME=0.0.0.0 is set in the Dockerfile).
#
# IMPORTANT: keep this service at ONE replica. The spend limiter
# (src/lib/providers/ratelimit.ts) counts in memory, which is correct and shared
# across requests on a single instance. Before scaling to multiple replicas,
# swap in a shared store via setRateLimitStore (see Milestone 2 / DEPLOY.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /api/health, not /. The homepage renders perfectly well on a deployment with
# no bot shield and no weekly cap, so "/" as a healthcheck proves only that Node
# is listening. /api/health answers whether the boot-time environment guard
# (src/instrumentation.ts) ran and passed, so a green healthcheck means the
# contract in src/lib/env/require.ts is actually being enforced on this process.
healthcheckPath = "/api/health"
healthcheckTimeout = 120
# A misconfigured production boot calls process.exit(1) from the instrumentation
# hook, before a single request is served. ON_FAILURE turns that into a crash
# loop with every missing variable named in the deploy log — loud and fixable —
# instead of a deploy that reports healthy while it is wide open.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
